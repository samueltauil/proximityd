name: Lint

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore tests/ProximityD.Tests/ProximityD.Tests.csproj
      - name: Check formatting
        run: dotnet format tests/ProximityD.Tests/ProximityD.Tests.csproj --verify-no-changes
