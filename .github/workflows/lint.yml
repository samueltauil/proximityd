name: Lint

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore ProximityD.sln
      - name: Check formatting
        run: dotnet format ProximityD.sln --verify-no-changes
