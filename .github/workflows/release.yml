name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/ProximityD/ProximityD.csproj
      - name: Build
        run: dotnet build src/ProximityD/ProximityD.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish src/ProximityD/ProximityD.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o publish/
      - name: Zip artifact
        run: Compress-Archive -Path publish/* -DestinationPath ProximityD-${{ github.ref_name }}-win-x64.zip
        shell: pwsh
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ProximityD-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
