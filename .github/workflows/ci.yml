name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore tests/ProximityD.Tests/ProximityD.Tests.csproj
      - name: Build
        run: dotnet build tests/ProximityD.Tests/ProximityD.Tests.csproj --no-restore
      - name: Test
        run: dotnet test tests/ProximityD.Tests/ProximityD.Tests.csproj --no-build --verbosity normal
