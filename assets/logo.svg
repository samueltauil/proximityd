<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0a2e6b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#shine)"/>

  <!-- Lock body - clean rounded rect -->
  <rect x="164" y="280" width="136" height="112" rx="20" fill="#ffffff"/>

  <!-- Bluetooth symbol as keyhole (negative space concept) -->
  <!-- Vertical stroke -->
  <rect x="226" y="302" width="8" height="68" rx="4" fill="#0a2e6b"/>
  <!-- Upper chevron -->
  <path d="M 234 306 L 254 326 L 234 346" stroke="#0a2e6b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Lower chevron (mirrored) -->
  <path d="M 234 346 L 214 366 L 234 386" stroke="#0a2e6b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="rotate(180 234 346)"/>

  <!-- Shackle - elegant open arc suggesting unlocked state -->
  <path d="M 198 280 L 198 216 C 198 176 224 152 264 152 C 304 152 330 176 330 216 L 330 240"
        stroke="#ffffff" stroke-width="22" stroke-linecap="round" fill="none"/>

  <!-- Proximity arcs - thin and elegant -->
  <path d="M 348 200 C 368 220 368 250 348 270"
        stroke="#64b5f6" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M 372 176 C 404 208 404 262 372 294"
        stroke="#64b5f6" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M 394 154 C 438 198 438 272 394 316"
        stroke="#64b5f6" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.3"/>
</svg>
