<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#0b1e45"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="lockBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8eaf6"/>
    </linearGradient>
    <linearGradient id="arc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#shine)"/>

  <!-- Subtle inner border -->
  <rect x="36" y="36" width="440" height="440" rx="97" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <!-- Lock body -->
    <rect x="172" y="284" width="128" height="104" rx="18" fill="url(#lockBody)"/>

    <!-- Shackle - clean symmetric arc, open on right to suggest unlock -->
    <path d="M 204 284 L 204 220 C 204 180 228 160 256 160 C 284 160 308 180 308 220 L 308 250"
          stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Bluetooth rune as keyhole — centered in lock body -->
  <g transform="translate(236, 298)">
    <!-- Vertical line -->
    <line x1="0" y1="0" x2="0" y2="56" stroke="#0b1e45" stroke-width="7" stroke-linecap="round"/>
    <!-- Upper chevron -->
    <polyline points="0,8 18,24 0,40" stroke="#0b1e45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Lower chevron (reflected) -->
    <polyline points="0,16 -18,32 0,48" stroke="#0b1e45" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Proximity arcs — elegant, consistent curvature -->
  <g filter="url(#glow)">
    <path d="M 340 224 C 358 244 358 276 340 296"
          stroke="url(#arc1)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M 364 200 C 394 232 394 288 364 320"
          stroke="url(#arc1)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55"/>
    <path d="M 386 178 C 426 220 426 300 386 342"
          stroke="url(#arc1)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.28"/>
  </g>
</svg>
