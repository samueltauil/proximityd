<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient — rich deep blue -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565c0"/>
      <stop offset="50%" stop-color="#0d3b82"/>
      <stop offset="100%" stop-color="#051b3e"/>
    </linearGradient>
    <!-- Subtle glass highlight -->
    <radialGradient id="glass" cx="35%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Lock face gradient -->
    <linearGradient id="lockFace" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
    <!-- Shackle metallic -->
    <linearGradient id="shackle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
    <!-- Arc gradient -->
    <linearGradient id="arc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#29b6f6"/>
    </linearGradient>
    <!-- Shadows -->
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glass)"/>

  <!-- Lock assembly -->
  <g filter="url(#dropShadow)">
    <!-- Shackle — thick, open, communicates "unlocked by proximity" -->
    <path d="M 176 270 L 176 188 C 176 130 210 98 256 98 C 302 98 336 130 336 188 L 336 222"
          stroke="url(#shackle)" stroke-width="32" stroke-linecap="round" fill="none"/>

    <!-- Lock body — large, rounded, dominant -->
    <rect x="144" y="270" width="200" height="160" rx="28" fill="url(#lockFace)"/>
  </g>

  <!-- Keyhole -->
  <circle cx="244" cy="332" r="18" fill="#0d3b82"/>
  <path d="M 236 346 L 244 392 L 252 346 Z" fill="#0d3b82"/>

  <!-- Proximity signal arcs — right side, vertically centered -->
  <g filter="url(#softGlow)">
    <path d="M 368 300 C 390 324 390 376 368 400"
          stroke="url(#arc)" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 394 278 C 428 314 428 386 394 422"
          stroke="url(#arc)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 420 258 C 464 304 464 396 420 442"
          stroke="url(#arc)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>
</svg>
