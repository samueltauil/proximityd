<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- GitHub dark background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d333b"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <!-- Glass highlight -->
    <radialGradient id="glass" cx="35%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Lock face -->
    <linearGradient id="lockFace" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
    <!-- Shackle metallic -->
    <linearGradient id="shackle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9d1d9"/>
      <stop offset="50%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>
    <!-- Arc gradient — GitHub blue/green accent -->
    <linearGradient id="arc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <!-- Shadows -->
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#010409" flood-opacity="0.5"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas background -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <rect width="512" height="512" rx="114" fill="url(#glass)"/>

  <!-- Lock assembly -->
  <g filter="url(#dropShadow)">
    <!-- Shackle -->
    <path d="M 176 270 L 176 188 C 176 130 210 98 256 98 C 302 98 336 130 336 188 L 336 222"
          stroke="url(#shackle)" stroke-width="32" stroke-linecap="round" fill="none"/>

    <!-- Lock body -->
    <rect x="144" y="270" width="200" height="160" rx="28" fill="url(#lockFace)"/>
  </g>

  <!-- Keyhole — realistic shape: circle + rounded slot -->
  <circle cx="244" cy="330" r="16" fill="#0d1117"/>
  <rect x="237" y="340" width="14" height="40" rx="5" fill="#0d1117"/>
  <!-- Inner highlight for depth -->
  <circle cx="244" cy="330" r="10" fill="none" stroke="#2d333b" stroke-width="2" opacity="0.5"/>
  <rect x="239" y="342" width="10" height="36" rx="4" fill="none" stroke="#2d333b" stroke-width="1.5" opacity="0.4"/>

  <!-- Proximity signal arcs -->
  <g filter="url(#softGlow)">
    <path d="M 368 300 C 390 324 390 376 368 400"
          stroke="url(#arc)" stroke-width="11" stroke-linecap="round" fill="none" opacity="0.95"/>
    <path d="M 394 278 C 428 314 428 386 394 422"
          stroke="url(#arc)" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 420 258 C 464 304 464 396 420 442"
          stroke="url(#arc)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>
</svg>
